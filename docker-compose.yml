services:
  mysql84:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: astronomia
    volumes:
      - mysql84-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: kmosorio40/exoplanetas:v1.0
    build: .
    depends_on:
      mysql84:
        condition: service_healthy
    environment:
      DB_HOST: mysql84
    ports:
      - "8501:8501"

volumes:
  mysql84-data:
